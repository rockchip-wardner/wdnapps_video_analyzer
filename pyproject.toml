[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdnapps-video-analyzer"
version = "0.1.1"
description = "wdnwebui 视频分析类应用插件：音视频描述 / 视频目标监控 / 视频任意目标定位 / 监控反查 / 音视频分析"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "pyrk-sdk" }]

# 刻意不声明 wdnwebui 依赖：宿主不是 PyPI 包，是同一个 .venv 里
# 从仓库根直接跑的 FastAPI 服务（run.py → app.main:app）。卡片代码
# import 的是 `app.core.*`，由 wdnwebui 自己的启动脚本把仓库根放进
# sys.path。把 wdnwebui 写进 dependencies 会让 pip 去 PyPI 找一个
# 不存在的同名包并直接安装失败。
#
# 真要表达这层耦合，宿主侧的插件发现通道（app/core/manifest.py 的
# `_discover_from_entry_points`）才是它的位置：它 import 本包失败
# 时只 LOG.error 并跳过，不会拖垮整个 web UI。
dependencies = [
    "pydantic>=1.10",
    "fastapi>=0.100",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0"]

# ---------------------------------------------------------------------------
# 插件注册表 —— wdnwebui manifest 加载器唯一识别的 group
#
#   左边 = 卡片 id，必须与该卡 manifest.json 里的 "id" 逐字相同
#           （宿主会做一致性校验，不一致直接 FATAL 跳过该卡）。
#           注意这里是【连字符】不是下划线：Python 包目录用下划线
#           （cards/video_detection/），但卡 id 一直用连字符
#           （"video-detection"），别想当然按模块名写。
#   右边 = 可 import 的卡片模块；宿主据此定位卡片目录
#           （模块所在目录 + /manifest.json + /static/）
# ---------------------------------------------------------------------------
[project.urls]
Homepage = "https://github.com/rockchip-wardner/wdnapps_video_analyzer"
Repository = "https://github.com/rockchip-wardner/wdnapps_video_analyzer"
Issues = "https://github.com/rockchip-wardner/wdnapps_video_analyzer/issues"

[project.entry-points."wdnwebui.cards"]
"video-detection" = "wdnapps_video_analyzer.cards.video_detection"
"video-target-detection" = "wdnapps_video_analyzer.cards.video_target_detection"
"video-target-localization" = "wdnapps_video_analyzer.cards.video_target_localization"
"video-retrieval" = "wdnapps_video_analyzer.cards.video_retrieval"
"video-depth" = "wdnapps_video_analyzer.cards.video_depth"
"audio-analysis" = "wdnapps_video_analyzer.cards.audio_analysis"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wdnapps_video_analyzer*"]
exclude = ["tests*"]

# 关键：template.html / app.js / app.css / wizard.json 必须进 wheel，
# 否则宿主挂载 /static/apps/<id> 时目录是空的（卡片仍会被发现，
# 但前端 404 —— 这正是插件化最容易踩且最难一眼看出的坑）。
[tool.setuptools.package-data]
"wdnapps_video_analyzer.cards.video_detection" = ["manifest.json", "static/*"]
"wdnapps_video_analyzer.cards.video_target_detection" = ["manifest.json", "static/*"]
"wdnapps_video_analyzer.cards.video_target_localization" = ["manifest.json", "static/*"]
"wdnapps_video_analyzer.cards.video_retrieval" = ["manifest.json", "static/*"]
"wdnapps_video_analyzer.cards.video_depth" = ["manifest.json", "static/*"]
"wdnapps_video_analyzer.cards.audio_analysis" = ["manifest.json", "static/*"]